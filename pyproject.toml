[project]
name = "a2a-poc"
version = "0.1.0"
description = "A2A protocol proof-of-concept: one LLM-backed agent + streaming client"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[fastapi]>=1.3",
    "uvicorn>=0.30",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
a2a-poc-server = "a2a_poc.server:main"
a2a-poc-client = "a2a_poc.client:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
