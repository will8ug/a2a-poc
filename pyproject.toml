[project]
name = "a2a-poc"
version = "0.1.0"
description = "A2A protocol proof-of-concept: one LLM-backed agent + streaming client"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[fastapi]>=1.3",
    "uvicorn>=0.30",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "streamlit>=1.58",
    "tavily-python>=0.8",
]

[project.scripts]
a2a-poc-chat = "a2apoc.chat.app:main"
a2a-poc-client = "a2apoc.client.cli:main"
a2a-poc-ui = "a2apoc.client.ui:main"
a2a-poc-search-agent = "a2apoc.search.app:main"
a2a-poc-host = "a2apoc.host.app:main"
a2a-poc-demo = "a2apoc.demo:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# uv_build otherwise derives the module name from the project name
# (a2a-poc → underscore form); the import package is "a2apoc".
[tool.uv.build-backend]
module-name = "a2apoc"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Test files repeat basenames across tests/chat and tests/search (e.g.
# test_config.py); importlib mode imports each by path so they don't collide.
addopts = "--import-mode=importlib"
